<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新品开发与变更管理程序</title>
  <style>
    :root { --ok:#16a34a; --warn:#dc2626; --bg:#f6f8fb; --card:#fff; --text:#0f172a; --line:#d8dee8; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif; background:var(--bg); color:var(--text); }
    .container { max-width:1280px; margin:24px auto; padding:0 16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; box-shadow:0 2px 8px rgba(15,23,42,.05); margin-bottom:16px; }
    h1 { margin:0 0 12px; font-size:24px; }
    .controls { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; align-items:end; }
    .inline-row { display:flex; gap:8px; }
    label { display:block; font-size:13px; margin-bottom:6px; color:#334155; }
    select,input,button { width:100%; height:38px; border:1px solid #cbd5e1; border-radius:8px; padding:0 10px; font-size:14px; background:#fff; }
    button { cursor:pointer; font-weight:600; background:#2563eb; color:#fff; border:none; }
    button:hover { background:#1d4ed8; }
    button.danger { background:#dc2626; }
    button.danger:hover { background:#b91c1c; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th,td { border:1px solid var(--line); padding:8px; text-align:center; }
    th { background:#f1f5f9; }
    td.left { text-align:left; }
    .light { width:14px; height:14px; border-radius:50%; margin:0 auto; background:var(--ok); box-shadow:0 0 0 3px rgba(22,163,74,.15); }
    .light.warn { background:var(--warn); box-shadow:0 0 0 3px rgba(220,38,38,.2); }
    .summary { display:flex; gap:16px; flex-wrap:wrap; align-items:center; font-size:14px; }
    .pill { padding:6px 10px; border-radius:999px; font-weight:600; border:1px solid transparent; }
    .pill.ok { color:#166534; background:#dcfce7; border-color:#86efac; }
    .pill.warn { color:#7f1d1d; background:#fee2e2; border-color:#fca5a5; }
    .tips { font-size:13px; color:#475569; line-height:1.6; }
    .tool-cell { display:flex; gap:6px; justify-content:center; }
    .tool-cell button { height:30px; width:auto; padding:0 8px; }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>新品开发与变更管理程序</h1>
    <div class="controls">
      <div>
        <label>项目类型（可下拉选择）</label>
        <select id="projectType"><option value="新品开发">新品开发</option><option value="变更管理">变更管理</option></select>
      </div>
      <div>
        <label>零件号（可新增/删除）</label>
        <div class="inline-row">
          <select id="partSelect"></select>
          <button type="button" id="deletePartBtn" class="danger">删除</button>
        </div>
      </div>
      <div>
        <label>新增零件号</label>
        <div class="inline-row">
          <input id="newPartInput" type="text" placeholder="例如：PN-2026-001" />
          <button type="button" id="addPartBtn">新增</button>
        </div>
      </div>
      <div>
        <label>任务接收日期</label>
        <input type="date" id="startDate" />
      </div>
      <div>
        <label>&nbsp;</label>
        <button id="refreshBtn">刷新超期状态</button>
      </div>
    </div>
  </div>

  <div class="card">
    <label>新增项目节点（可插入到中间）</label>
    <div class="controls">
      <input id="newItem" placeholder="项目名称" />
      <input id="newStartPoint" placeholder="起始点" value="接到任务" />
      <input id="newDays" type="number" step="0.5" min="0" value="1" />
      <div class="inline-row">
        <select id="ownerSelect"></select>
        <button type="button" id="deleteOwnerBtn" class="danger">删除</button>
      </div>
      <select id="insertAfter">
        <option value="end">插入到末尾</option>
      </select>
      <button id="addNodeBtn" type="button">新增项目节点</button>
      <input id="newOwnerInput" placeholder="新增工程师姓名" />
      <button id="addOwnerBtn" type="button">新增工程师</button>
    </div>
  </div>

  <div class="card"><div class="summary" id="summary"></div></div>

  <div class="card">
    <table>
      <thead>
      <tr><th>序号</th><th>项目</th><th>起始点（说明/日期）</th><th>节点要求（天）</th><th>责任人</th><th>计划完成</th><th>状态灯</th><th>操作</th></tr>
      </thead>
      <tbody id="nodeBody"></tbody>
    </table>
  </div>

  <div class="card tips">
    <strong>备注：</strong>
    <ul>
      <li>支持新品开发与变更管理下拉切换。</li>
      <li>支持零件号新增与删除。</li>
      <li>项目列节点支持按需新增与删除；删除后会自动重排序号。</li>
      <li>当今天晚于计划完成日期时亮红灯警示。</li>
    </ul>
  </div>
</div>

<script>
  const defaultNodes = [
    { item:'新品评审', startPoint:'接到信息', days:2, owner:'项目工程师' },
    { item:'变更评审', startPoint:'接到信息', days:2, owner:'项目工程师' },
    { item:'PLM任务创建', startPoint:'接到任务', days:1, owner:'王梦' },
    { item:'新品报价', startPoint:'评审完成', days:2, owner:'项目工程师' },
    { item:'技术通知', startPoint:'评审完成', days:2, owner:'项目工程师' },
    { item:'建表讨论下发', startPoint:'接到开发通知', days:2, owner:'项目工程师' },
    { item:'图纸转化', startPoint:'接到开发通知', days:3, owner:'项目工程师' },
    { item:'模具鉴定', startPoint:'模具到厂', days:3, owner:'项目工程师' },
    { item:'工艺下发', startPoint:'模具到厂', days:2, owner:'项目工程师' },
    { item:'材料试验（物性）', startPoint:'接到任务', days:2, owner:'寿子启' },
    { item:'产品试验', startPoint:'接到任务', days:1, owner:'张倩' },
    { item:'BOM创建', startPoint:'接到任务', days:1, owner:'郭鑫' },
    { item:'产品检验卡', startPoint:'接到开发通知', days:5, owner:'项目工程师' },
    { item:'作业检验卡', startPoint:'接到开发通知', days:5, owner:'项目工程师' },
    { item:'文件提交', startPoint:'接到任务', days:7, owner:'项目工程师' },
    { item:'质量问题处理', startPoint:'接到任务', days:0.5, owner:'项目工程师' }
  ];

  const projectAdjust = { '新品开发': 1, '变更管理': 0.8 };
  let partNumbers = ['PN-2026-001', 'PN-2026-002'];
  let currentNodes = [...defaultNodes];
  let owners = [...new Set(defaultNodes.map(n => n.owner))];
  let nodeStartDates = [];

  const nodeBody = document.getElementById('nodeBody');
  const summary = document.getElementById('summary');
  const projectTypeEl = document.getElementById('projectType');
  const startDateEl = document.getElementById('startDate');
  const partSelectEl = document.getElementById('partSelect');
  const insertAfterEl = document.getElementById('insertAfter');
  const ownerSelectEl = document.getElementById('ownerSelect');

  startDateEl.value = new Date().toISOString().slice(0, 10);


  function toDateInputValue(date) {
    const d = new Date(date);
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${d.getFullYear()}-${m}-${day}`;
  }

  function rebuildNodeStartDates() {
    const base = new Date(startDateEl.value + 'T09:00:00');
    nodeStartDates = currentNodes.map((_, i) => {
      if (i === 0) return toDateInputValue(base);
      const prev = nodeStartDates[i - 1] || toDateInputValue(base);
      const prevDays = Number(currentNodes[i - 1].days) || 0;
      return toDateInputValue(addDays(new Date(prev + 'T09:00:00'), prevDays));
    });
  }

  function addDays(date, days) {
    const result = new Date(date);
    result.setDate(result.getDate() + Math.floor(days));
    if (days % 1 !== 0) result.setHours(result.getHours() + (days % 1) * 24);
    return result;
  }

  function fmt(date) {
    return date.toLocaleDateString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit' });
  }


  function renderOwnerOptions(selected) {
    ownerSelectEl.innerHTML = '';
    owners.forEach(o => {
      const op = document.createElement('option');
      op.value = o;
      op.textContent = o;
      ownerSelectEl.appendChild(op);
    });
    if (selected && owners.includes(selected)) ownerSelectEl.value = selected;
  }

  function renderPartOptions(selected) {
    partSelectEl.innerHTML = '';
    partNumbers.forEach(p => {
      const op = document.createElement('option');
      op.value = p;
      op.textContent = p;
      partSelectEl.appendChild(op);
    });
    if (selected && partNumbers.includes(selected)) partSelectEl.value = selected;
  }


  function renderInsertOptions() {
    const selected = insertAfterEl.value || 'end';
    insertAfterEl.innerHTML = '<option value="end">插入到末尾</option>';
    currentNodes.forEach((n, i) => {
      const op = document.createElement('option');
      op.value = String(i);
      op.textContent = `插入到第 ${i + 1} 项后（${n.item}）`;
      insertAfterEl.appendChild(op);
    });
    const valid = selected === 'end' || currentNodes[selected];
    insertAfterEl.value = valid ? selected : 'end';
  }
  function removeNode(index) {
    currentNodes.splice(index, 1);
    nodeStartDates.splice(index, 1);
    renderInsertOptions();
    if (nodeStartDates.length !== currentNodes.length) rebuildNodeStartDates();
    render();
  }

  function render() {
    const type = projectTypeEl.value;
    const factor = projectAdjust[type] || 1;
    const selectedPart = partSelectEl.value || (partNumbers[0] || '-');
    const start = new Date(startDateEl.value + 'T09:00:00');
    const now = new Date();
    if (nodeStartDates.length !== currentNodes.length) rebuildNodeStartDates();

    const nodes = currentNodes.map((n, i) => ({
      no: i + 1,
      item: n.item,
      startPoint: n.startPoint,
      days: +(n.days * factor).toFixed(1),
      owner: n.owner
    }));

    nodeBody.innerHTML = '';
    let overdueCount = 0;

    nodes.forEach((n, i) => {
      const rowStartStr = nodeStartDates[i] || toDateInputValue(start);
      const rowStart = new Date(rowStartStr + "T09:00:00");
      const deadline = addDays(rowStart, n.days);
      const overdue = now > deadline;
      if (overdue) overdueCount++;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${n.no}</td>
        <td class="left">${n.item}</td>
        <td class="left">${n.startPoint}<br /><input type="date" data-start-index="${i}" value="${nodeStartDates[i] || ""}" /></td>
        <td>≤${n.days}</td>
        <td>${n.owner}</td>
        <td>${fmt(deadline)}</td>
        <td><div class="light ${overdue ? 'warn' : ''}" title="${overdue ? '已超期' : '正常'}"></div></td>
        <td class="tool-cell"><button class="danger" data-index="${i}" type="button">删除项目</button></td>
      `;
      nodeBody.appendChild(tr);
    });

    const allOk = overdueCount === 0;
    summary.innerHTML = `
      <span class="pill ${allOk ? 'ok' : 'warn'}">${type}：${allOk ? '全部节点正常' : `存在 ${overdueCount} 个超期节点`}</span>
      <span>零件号：${selectedPart}</span>
      <span>开始日期：${fmt(start)}</span>
      <span>当前日期：${fmt(now)}</span>
      <span>节点总数：${nodes.length}</span>
    `;

    document.querySelectorAll('.tool-cell button').forEach(btn => {
      btn.addEventListener('click', (e) => removeNode(Number(e.target.dataset.index)));
    });
    document.querySelectorAll('input[data-start-index]').forEach(input => {
      input.addEventListener('change', (e) => {
        const idx = Number(e.target.dataset.startIndex);
        nodeStartDates[idx] = e.target.value;
        render();
      });
    });
  }

  document.getElementById('addPartBtn').addEventListener('click', () => {
    const input = document.getElementById('newPartInput');
    const value = input.value.trim();
    if (!value) return;
    if (partNumbers.includes(value)) { alert('零件号已存在'); return; }
    partNumbers.push(value);
    renderPartOptions(value);
    input.value = '';
    render();
  });

  document.getElementById('deletePartBtn').addEventListener('click', () => {
    if (partNumbers.length <= 1) { alert('至少保留一个零件号'); return; }
    const current = partSelectEl.value;
    partNumbers = partNumbers.filter(p => p !== current);
    renderPartOptions(partNumbers[0]);
    render();
  });

  document.getElementById('addNodeBtn').addEventListener('click', () => {
    const item = document.getElementById('newItem').value.trim();
    const startPoint = document.getElementById('newStartPoint').value.trim() || '接到任务';
    const days = Number(document.getElementById('newDays').value);
    const owner = ownerSelectEl.value || '项目工程师';
    if (!item) { alert('请输入项目名称'); return; }
    if (Number.isNaN(days) || days < 0) { alert('节点天数无效'); return; }
    const newNode = { item, startPoint, days, owner };
    const insertAfter = insertAfterEl.value;
    if (insertAfter === 'end') {
      currentNodes.push(newNode);
      nodeStartDates.push(toDateInputValue(new Date(startDateEl.value + "T09:00:00")));
    } else {
      const idx = Number(insertAfter);
      currentNodes.splice(idx + 1, 0, newNode);
      nodeStartDates.splice(idx + 1, 0, toDateInputValue(new Date(startDateEl.value + "T09:00:00")));
    }
    document.getElementById('newItem').value = '';
    renderInsertOptions();
    render();
  });


  document.getElementById('addOwnerBtn').addEventListener('click', () => {
    const input = document.getElementById('newOwnerInput');
    const value = input.value.trim();
    if (!value) return;
    if (owners.includes(value)) { alert('工程师已存在'); return; }
    owners.push(value);
    renderOwnerOptions(value);
    input.value = '';
  });

  document.getElementById('deleteOwnerBtn').addEventListener('click', () => {
    if (owners.length <= 1) { alert('至少保留一个工程师'); return; }
    const current = ownerSelectEl.value;
    if (currentNodes.some(n => n.owner === current)) {
      alert('该工程师已被节点使用，请先修改或删除相关节点');
      return;
    }
    owners = owners.filter(o => o !== current);
    renderOwnerOptions(owners[0]);
  });

  document.getElementById('refreshBtn').addEventListener('click', render);
  projectTypeEl.addEventListener('change', render);
  startDateEl.addEventListener('change', () => { rebuildNodeStartDates(); render(); });
  partSelectEl.addEventListener('change', render);

  renderPartOptions(partNumbers[0]);
  renderOwnerOptions(owners[0]);
  renderInsertOptions();
  rebuildNodeStartDates();
  render();
</script>
</body>
</html>
